  <!-- The Desktop's own "About Me" (personal side). Kept here, not on the
       professional pages, so the two sides have different About text. -->
  <template id="desktop-about">
    <section>
      <h2 class="section-label">About me</h2>
      <p>Hi, I’m Nikolas Campos, but you can call me Niko. I love writing stories and songs, and I keep a running record of my thoughts. I’m also a big tech person, and I love putting it to work: shooting and editing videos, building websites with AI and deploying them. Technology has always been a huge part of my life (thanks, Pop). I learn a lot by watching how people move through the world and by reading whatever I can get my hands on. By day I work in IT. By night I’m writing songs and playing video games, mostly Halo, though I recently got back into Call of Duty. I love spending time with my wife, taking trips to Disney, and checking in on my friends. I’m still learning about myself and the world. The wider my horizons get, the scarier life can seem, but I’m grateful my foundation is built on faith in Jesus.</p>
    </section>
  </template>

  <!-- "About This Site" (Desktop only): the story of building the site. -->
  <template id="desktop-site">
    <section>
      <h2 class="section-label">How I built this site</h2>
      <p>I’ve been trying to build my own website for years. I’d learn HTML, C, and Python and get pretty decent at them, and then it would all fall apart as soon as I took a break and came back. I’ve known about AI since around 2023, but I didn’t pay it much attention because I didn’t think it’d be worth my time. Still, a small part of me got excited every time I read about how close we were getting to having our own C-3PO or J.A.R.V.I.S. on call for everyday stuff. What I didn’t see coming was that AI would fill in the gaps in my patchy computer science knowledge. In the last couple of weeks alone, I’ve done more than I ever had before. AI took a website I’d spent two months on, rebuilt it, and added new features in about 20 minutes. That’s impressive. I know AI gets a lot of flak for what it’s doing to the environment, but I think people tend to judge it unfairly. Plus, a lot of that blame belongs on the companies that build data centers in places where they drain the life out of the towns around them. smh.</p>
    </section>
  </template>
