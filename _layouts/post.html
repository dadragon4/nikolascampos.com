<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | escape }} — Nikolas Campos</title>
  <meta name="description" content="{{ page.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="stylesheet" href="../css/styles.css?v=11">
  <script src="../js/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrap">

    <header class="site">
      <h1><a href="../index.html">Nikolas Campos</a></h1>
      <a class="view-switch" href="../desktop.html">Desktop view</a>
      <p class="tagline">Media. Music. Life.</p>
      <nav class="site">
        <a href="../index.html">Home</a>
        <details class="menu">
          <summary>Portfolio</summary>
          <div class="menu-list">
            <a href="../film.html">Film</a>
            <a href="../photography.html">Photography</a>
          </div>
        </details>
        <a href="../music.html">Music</a>
        <a href="../writing.html">Writing</a>
        <a href="../blog.html" aria-current="page">Blog</a>
        <a href="../about.html">About</a>
      </nav>
    </header>

    <main id="main">
      <hr class="rule">

      <article class="post{% if page.verse %} verse{% endif %}">
        <h2 class="post-title">{{ page.title | escape }}</h2>
        <span class="meta">by Nikolas Campos · {% include date.html date=page.date %}</span>
{{ content }}
      </article>

      <p class="post-back"><a href="../blog.html"><span aria-hidden="true">←</span> All posts</a></p>
    </main>

    <footer class="site">
      © 2026 Nikolas Campos. Built in HTML.
    </footer>

  </div>
</body>
</html>
