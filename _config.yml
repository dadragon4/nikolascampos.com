# GitHub Pages (Jekyll) settings. The regular pages are plain HTML and are
# copied as-is. Jekyll only builds the blog: Markdown posts in _posts/ become
# pages at /blog/<slug>.html using _layouts/post.html, and blog.html lists them.

# Every post uses the post layout, so posts don't need "layout:" themselves.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # Keep these out of the sitemap
  - scope:
      path: "desktop.html"
    values:
      sitemap: false
  - scope:
      path: "404.html"
    values:
      sitemap: false
  # Private shortcut to the site editor (Pages CMS)
  - scope:
      path: "admin"
    values:
      sitemap: false
  # Hidden for now (Oct 31, 2026); remove this to list it again
  - scope:
      path: "photography.html"
    values:
      sitemap: false

permalink: /blog/:title.html

# The site's address (used for the sitemap and blog post links in search results).
url: https://www.nikolascampos.com

# Builds /sitemap.xml automatically, including every blog post.
plugins:
  - jekyll-sitemap

# One line break in a post = one line break on the page (like a notes app).
# A blank line starts a new paragraph.
kramdown:
  hard_wrap: true

# Project notes stay out of the published site.
exclude:
  - CLAUDE.md
  - CHANGELOG.md
  - HOW-TO-POST.md
  - README.md
  - plans
