# Settings for Pages CMS (https://app.pagescms.org), the backup editor.
# The main editor is Sveltia CMS at /studio-0c19d5/cms/ (studio-0c19d5/cms/config.yml);
# keep the fields of both in sync.
# Sign in there with GitHub to write blog posts and upload images in a
# friendly editor. Saving makes a commit to main, so the site updates about a
# minute later, like any other push. Jekyll ignores this file (it starts with
# a dot), so it isn't published.

# Uploaded images: stored in images/blog/, linked as /images/blog/name.jpg
media:
  input: images/blog
  output: /images/blog
  # Only pictures can be uploaded, and file names are made web-safe
  # ("My Photo 1.JPG" becomes "my-photo-1.jpg").
  categories: [image]
  rename: safe

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    # Jekyll takes the post's date from the file name: 2026-10-31-my-post.md
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      # Same Date field as Sveltia CMS (studio-0c19d5/cms/config.yml), so neither
      # editor drops it. Jekyll uses it as the post's date.
      - name: date
        label: Date
        type: date
      - name: excerpt
        label: Excerpt (one-line summary for the Blog list and Google)
        type: text
      - name: verse
        label: Poem (centers each line)
        type: boolean
      - name: image
        label: Cover image (shown at the top and when the post is shared)
        type: image
      - name: image_alt
        label: Cover image description (for screen readers)
        type: string
      - name: photos
        label: Photos (shown below the post)
        type: object
        list: true
        fields:
          - name: src
            label: Photo
            type: image
          - name: caption
            label: Caption (optional)
            type: string
      # "body" is the post itself, saved below the front matter as Markdown
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown

  - name: drafts
    label: Drafts (not published)
    type: collection
    path: _drafts
    # Drafts have no date. To publish one, move it to Blog posts.
    filename: "{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: excerpt
        label: Excerpt
        type: text
      - name: verse
        label: Poem (centers each line)
        type: boolean
      - name: image
        label: Cover image (shown at the top and when the post is shared)
        type: image
      - name: image_alt
        label: Cover image description (for screen readers)
        type: string
      - name: photos
        label: Photos (shown below the post)
        type: object
        list: true
        fields:
          - name: src
            label: Photo
            type: image
          - name: caption
            label: Caption (optional)
            type: string
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown

  # Show or hide pages (true = shown). Same as Sveltia's "Show or hide pages".
  - name: pages
    label: Show or hide pages
    type: file
    path: pages.json
    format: json
    fields:
      - { name: film, label: Film, type: boolean }
      - { name: photography, label: Photography, type: boolean }
      - { name: music, label: Music, type: boolean }
      - { name: services, label: Services, type: boolean }
      - { name: about, label: About, type: boolean }
      - { name: contact, label: Contact, type: boolean }
      - { name: writing, label: Writing (Desktop view only), type: boolean }
      - { name: blog, label: Blog (Desktop view only), type: boolean }
