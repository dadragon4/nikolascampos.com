# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.246.1/schema/sveltia-cms.json
#
# Settings for Sveltia CMS, the site's own editor at nikolascampos.com/studio-0c19d5/cms/.
# Sign in with a GitHub fine-grained token limited to this repository
# (Contents: read and write). The token is saved only in that browser.
# Saving makes a commit to main, so the site updates about a minute later.
# Keep the fields in sync with .pages.yml (Pages CMS, the backup editor)
# and HOW-TO-POST.md.

backend:
  name: github
  repo: dadragon4/nikolascampos.com
  branch: main
  # Token sign-in only (the "Sign In with GitHub" button needs a separate
  # sign-in server, which this site doesn't have).
  auth_methods: [token]

site_url: https://www.nikolascampos.com
display_url: https://www.nikolascampos.com

# Uploaded pictures: stored in images/blog/, linked as /images/blog/name.webp.
# Photos are shrunk to at most 2000px and converted to WebP so pages stay fast,
# and file names are made web-safe.
media_folder: images/blog
public_folder: /images/blog
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

# Web-safe file names for posts (no accents or symbols, which can break Jekyll).
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: posts
    label: Blog posts
    label_singular: Blog post
    folder: _posts
    create: true
    # Jekyll takes the post's date from the file name, e.g. 2026-10-31-my-post.md.
    # The date comes from the Date field (local time), so a post saved late at
    # night doesn't get tomorrow's date (Jekyll hides future posts).
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    summary: "{{title}} · {{date | date('MMM D, YYYY')}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, type: date, default: "{{now}}" }
      - { name: excerpt, label: "Excerpt (one-line summary for the Blog list and Google)", widget: text, required: false }
      - { name: verse, label: "Poem (centers each line)", widget: boolean, required: false, default: false }
      - { name: image, label: "Cover image (shown at the top and when the post is shared)", widget: image, required: false }
      - { name: image_alt, label: "Cover image description (for screen readers)", widget: string, required: false }
      - name: photos
        label: "Photos (shown below the post)"
        label_singular: Photo
        widget: list
        required: false
        fields:
          - { name: src, label: Photo, widget: image }
          - { name: caption, label: "Caption (optional)", widget: string, required: false }
      - { name: body, label: Post, widget: markdown }

  - name: drafts
    label: Drafts (not published)
    label_singular: Draft
    folder: _drafts
    create: true
    # Drafts have no date. To publish one, copy it into a new Blog post.
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: verse, label: "Poem (centers each line)", widget: boolean, required: false, default: false }
      - { name: image, label: "Cover image", widget: image, required: false }
      - { name: image_alt, label: "Cover image description", widget: string, required: false }
      - name: photos
        label: "Photos (shown below the post)"
        label_singular: Photo
        widget: list
        required: false
        fields:
          - { name: src, label: Photo, widget: image }
          - { name: caption, label: "Caption (optional)", widget: string, required: false }
      - { name: body, label: Post, widget: markdown }

  # Show or hide pages: switch a page off to take it out of the menu, the
  # footer, the home page and the Desktop view (see pages.json and js/site.js).
  - name: settings
    label: Site settings
    description: "Show or hide pages: switched off = hidden from the menu, footer, home page and Desktop view, and from Google. The page's address still works for anyone with the link. Changes show about a minute after saving."
    files:
      - name: pages
        label: Show or hide pages
        file: pages.json
        format: json
        fields:
          - { name: film, label: Film, widget: boolean, default: true }
          - { name: photography, label: Photography, widget: boolean, default: true }
          - { name: music, label: Music, widget: boolean, default: true }
          - { name: services, label: Services, widget: boolean, default: true }
          - { name: about, label: About, widget: boolean, default: true }
          - { name: contact, label: Contact, widget: boolean, default: true }
          - { name: writing, label: "Writing (Desktop view only)", widget: boolean, default: true }
          - { name: blog, label: "Blog (Desktop view only)", widget: boolean, default: true }
